name: Daily alert

# scheduling moved to a Render Cron Job for more precise timing - kept as
# workflow_dispatch only, for manual testing

on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger daily alert
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            https://apprentice.saltable.fyi/run-daily-alert
