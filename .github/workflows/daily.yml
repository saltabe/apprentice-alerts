name: Daily alert

on:
  schedule:
    - cron: "7 15 * * *" # ~10:07am EST / 11:07am EDT, matching Salon Apprentice's own send time; GitHub runs schedules late, worst at the top of the hour
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger daily alert
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            https://apprentice.saltable.fyi/run-daily-alert

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
