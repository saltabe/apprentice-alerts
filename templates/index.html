<div class="tag-container">
  <div id="tag-list"></div>
  <input type="text" id="tag-input" placeholder="Type answer and press Enter...">
  <!-- Hidden input that holds the actual combined string for form submission -->
  <input type="hidden" name="all_answers" id="hidden-answers">
</div>

<style>
  .tag-container {
    border: 1px solid #ccc;
    padding: 5px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    background: #fff;
  }
  #tag-input {
    border: none;
    outline: none;
    flex-grow: 1;
  }
  .tag {
    background: #e0e0e0;
    padding: 2px 8px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .tag .remove {
    cursor: pointer;
    color: red;
  }
</style>

<script>
  const tagInput = document.getElementById('tag-input');
  const tagList = document.getElementById('tag-list');
  const hiddenAnswers = document.getElementById('hidden-answers');
  let answersArray = [];

  tagInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const value = tagInput.value.trim();
      if (value && !answersArray.includes(value)) {
        answersArray.push(value);
        renderTags();
        tagInput.value = '';
      }
    }
  });

  function renderTags() {
    tagList.innerHTML = '';
    answersArray.forEach((tag, index) => {
      const tagEl = document.createElement('span');
      tagEl.classList.add('tag');
      tagEl.innerHTML = `${tag} <span class="remove" onclick="removeTag(${index})">&times;</span>`;
      tagList.appendChild(tagEl);
    });
    hiddenAnswers.value = answersArray.join(','); // Submits as "ans1,ans2,ans3"
  }

  function removeTag(index) {
    answersArray.splice(index, 1);
    renderTags();
  }
</script>
