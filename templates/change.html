{% extends "layout.html" %}

{% block main %}

{% for message in get_flashed_messages() %}
<p class="confirmation">{{ message }}</p>
{% endfor %}

{% if not unsubscribed %}
<h1>Manage your subscription</h1>

<form action="/update?token={{ token }}" method="post">
    {% include "_subscription_form.html" %}

    <button type="submit" name="action" value="update" class="btn-primary">Update subscription</button>
    <button
        type="submit"
        name="action"
        value="cancel"
        class="btn-text"
        onclick="return confirm('Unsubscribe from all alerts?')"
    >Unsubscribe</button>
</form>
{% endif %}

{% endblock %}
