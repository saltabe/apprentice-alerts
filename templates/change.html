{% extends "layout.html" %}

{% block main %}

<div class="container">
    <div class="section">
        <h2>Manage your subscription</h2>
        <form action="/update?token={{ token }}" method="post">
            {% include "_subscription_form.html" %}

            <button type="submit" name="action" value="update">Save changes</button>
            <button
                type="submit"
                name="action"
                value="cancel"
                onclick="return confirm('Unsubscribe from all alerts?')"
            >Unsubscribe</button>
        </form>
    </div>
</div>

{% endblock %}
