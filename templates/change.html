{% extends "layout.html" %}

{% block main %}

<h1>Manage your subscription</h1>
<p class="subtitle">Update your city or keywords, or unsubscribe entirely.</p>

<form action="/update?token={{ token }}" method="post">
    {% include "_subscription_form.html" %}

    <button type="submit" name="action" value="update" class="btn-primary">Save changes</button>
    <button
        type="submit"
        name="action"
        value="cancel"
        class="btn-text"
        onclick="return confirm('Unsubscribe from all alerts?')"
    >Unsubscribe</button>
</form>

{% endblock %}
